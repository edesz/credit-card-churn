# ============================== Project metadata ==============================

[project]
name = "cc-churn"
version = "0.1.0"
description = "Use ML to find customers at risk of churning, for client intervention."
authors = [{name = "edesz"}]
requires-python = ">= 3.10"
# These are the PyPI dependencies, added with: pixi add --pypi PACKAGE_NAME
dependencies = []

[tool.pixi.workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

# location where the build tool should find custom modules to be tested
[tool.setuptools.packages.find]
where = ["src"]

# ============================= Conda dependencies =============================

[tool.pixi.dependencies]
python = "3.12.10.*"
# use pyarrow from conda-forge in order to get required C dependencies
numpy = ">=2.4.3,<3"
pyarrow = ">=23.0.1,<24"
python-dotenv = ">=1.2.2,<2"
openpyxl = ">=3.1.5,<4"
boto3 = ">=1.42.95,<2"
pandas = ">=3.0.2,<4"
pandera-pandas = ">=0.31.1,<0.32"
pandera-hypotheses = ">=0.31.1,<0.32"
matplotlib = ">=3.10.9,<4"
seaborn = ">=0.13.2,<0.14"
vegafusion = ">=2.0.3,<3"
altair = ">=6.1.0,<7"
vl-convert-python = ">=2.0.0rc1,<3"
scikit-learn = ">=1.8.0,<2"
metaflow = ">=2.19.22,<3"
xgboost = ">=3.2.0,<4"
joblib = ">=1.5.3,<2"
shap = ">=0.51.0,<0.52"

# ================== Make this project available as a package ==================

[tool.pixi.pypi-dependencies]
cc-churn = { path = ".", editable = true }

# ========= Specify non-essential dependencies in features ========

[tool.pixi.feature.notebooks.dependencies]
# create a notebooks feature for exploration
ipykernel = ">=7.2.0,<8"
ipywidgets = ">=8.1.8,<9"
jupyterlab = ">=4.5.6,<5"
jupyterlab-myst = ">=2.6.0,<3"
jupysql = ">=0.11.1,<0.12"
jupytext = ">=1.19.1,<2"
jupyter_server_ydoc = ">=2.3.0,<3"
jupyter_server_documents = ">=0.2.0,<0.3"
jupyter_server_fileid = ">=0.9.2,<0.10"
jupyter-ruff = ">=0.3.1,<0.4"
nbconvert = ">=7.17.1,<8"
nbclassic = ">=1.3.3,<2"
panel = ">=1.8.10,<2"
toml = ">=0.10.2,<0.11"

[tool.pixi.feature.nbrunner.dependencies]
# create a notebook runner feature to perform data or ML validation
ipykernel = ">=7.2.0,<8"
nbconvert = ">=7.17.1,<8"
nbformat = ">=5.10.4,<6"
pytz = ">=2026.1.post1,<2027"
papermill = ">=2.7.0,<3"
typer = ">=0.24.2,<0.25"

[tool.pixi.feature.test.dependencies]
# create a test feature
ipykernel = ">=7.2.0,<8"
moto = ">=5.1.22,<6"
pytest = ">=9.0.3,<10"
coverage = ">=7.13.5,<8"
pytest-html = ">=4.2.0,<5"

# ========= Specify non-essential dependencies in environments ========

[tool.pixi.environments]
# create environments that use features created above
default = { solve-group = "default" }
# notebooks env inherits default feature and notebooks feature to run jlab
notebooks = { features = ['default', "notebooks"], solve-group = "notebooks" }
# nbrunner env inherits default feature and nbrunner feature to run papermill
nbrunner = { features = ["default", "nbrunner"], solve-group = "nbrunner" }
# test env inherits default feature and unit-test feature to run pytest
test = { features = ["default", "test"], solve-group = "default" }

# ========================== Define tasks (shortcuts) ==========================

[tool.pixi.feature.notebooks.tasks]
# run development tasks for the notebooks feature
jlab = { cmd = """
    jupyter lab""", depends-on = [], description="""\
    Launch Jupyterlab\
    """, default-environment = "notebooks" }

[tool.pixi.feature.test.tasks]
# run unit-test tasks with Pytest for the test feature
test = { cmd = """
    coverage run -m pytest &&
    coverage report -m &&
    coverage html && coverage xml
    """, description="""\
    Run unit tests with Pytest\
    """, default-environment = "test" }

[tool.pixi.feature.nbrunner.tasks]
# programmatically run ML validation experiments for the nbrunner feature
mlval = { cmd = """
    python3 papermill_runner.py 05
    """, description="""\
    Run ML Validation experiments with Metaflow\
    """, default-environment = "nbrunner" }
# programmatically run data validation for the nbrunner feature
dval = { cmd = """
    python3 papermill_runner.py 13
    """, description="""\
    Validate customer data with Pandera\
    """, default-environment = "nbrunner" }
