# ============================== Project metadata ==============================

[project]
name = "cc-churn"
version = "0.1.0"
description = "Use ML to find customers at risk of churning, for client intervention."
authors = [{name = "edesz"}]
requires-python = ">= 3.10"
# These are the PyPI dependencies, added with: pixi add --pypi PACKAGE_NAME
dependencies = []

[tool.pixi.workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

# location where the build tool should find custom modules to be tested
[tool.setuptools.packages.find]
where = ["src"]

# ============================= Conda dependencies =============================

[tool.pixi.dependencies]
python = "3.12.10.*"
# use pyarrow from conda-forge in order to get required C dependencies
numpy = ">=2.5.2,<3"
pyarrow = ">=23.0.1,<24"
python-dotenv = ">=1.2.3,<2"
openpyxl = ">=3.1.5,<4"
xlsxwriter = ">=3.2.9,<4"
boto3 = ">=1.43.82,<2"
mypy-boto3-s3 = ">=1.43.66,<2"
pandas = ">=3.0.5,<4"
great_tables = ">=0.23.0,<0.24"
pandera-pandas = ">=0.32.1,<0.33"
pandera-hypotheses = ">=0.32.1,<0.33"
matplotlib = ">=3.10.9,<4"
seaborn = ">=0.13.2,<0.14"
vegafusion = ">=2.0.3,<3"
altair = ">=6.2.2,<7"
vl-convert-python = ">=2.0.0rc1,<3"
scikit-learn = ">=1.9.0,<2"
mlforecast = "*"
lightgbm = "*"
tqdm = ">=4.70.0,<5"
metaflow = ">=2.19.38,<3"
xgboost = ">=3.4.1,<4"
joblib = ">=1.5.3,<2"
evidently = ">=0.7.21,<0.8"
shap = ">=0.52.0,<0.53"
panel = ">=1.9.4,<2"

# ================== Make this project available as a package ==================

[tool.pixi.pypi-dependencies]
cc-churn = { path = ".", editable = true }

# ========= Specify non-essential dependencies in features ========

[tool.pixi.feature.notebooks.dependencies]
# create a notebooks feature for exploration
ipykernel = ">=7.3.0,<8"
ipywidgets = ">=8.1.9,<9"
jupyterlab = ">=4.6.3,<5"
jupyterlab-myst = ">=2.7.0,<3"
jupysql = ">=0.11.1,<0.12"
jupytext = ">=1.19.5,<2"
jupyter_server = "*"
jupyter-collaboration = "*"
jupyter_server_ydoc = ">=3.0.2,<4"
jupyter_server_documents = ">=0.3.3,<0.4"
jupyter_server_fileid = ">=0.9.2,<0.10"
jupyter-ruff = ">=0.3.1,<0.4"
nbconvert = ">=7.17.1,<8"
nbclassic = ">=1.3.3,<2"
panel = ">=1.9.4,<2"
toml = ">=0.10.2,<0.11"

[tool.pixi.feature.nbrunner.dependencies]
# create a notebook runner feature to programmatically run notebooks
ipykernel = ">=7.3.0,<8"
nbconvert = ">=7.17.1,<8"
nbformat = ">=5.11.1,<6"
pytz = ">=2026.3.post1,<2027"
papermill = ">=2.7.0,<3"
typer = ">=0.27.2,<0.28"

[tool.pixi.feature.test.dependencies]
# create a test feature
ipykernel = ">=7.3.0,<8"
moto = ">=5.2.3,<6"
pytest = ">=9.1.1,<10"
coverage = ">=7.16.0,<8"
pytest-html = ">=4.2.0,<5"

[tool.pixi.feature.docs.dependencies]
# create an (empty) docs feature

# ========= Specify non-essential dependencies in environments ========

[tool.pixi.environments]
# create environments that use features created above
default = { solve-group = "default" }
# notebooks env inherits default feature and notebooks feature to run jlab
notebooks = { features = ['default', "notebooks"], solve-group = "notebooks" }
# nbrunner env inherits default feature and nbrunner feature to run papermill
nbrunner = { features = ["default", "nbrunner"], solve-group = "nbrunner" }
# test env inherits default feature and unit-test feature to run pytest
test = { features = ["default", "test"], solve-group = "default" }
# define website env with no solve-group and only docs feature
docs = { features = ["docs"], no-default-feature = true }

# ========================== Define tasks (shortcuts) ==========================

[tool.pixi.feature.notebooks.tasks]
# run development tasks for the notebooks feature
script = { cmd = """
    cd notebooks && python3 11_script.py""", depends-on = [], description="""\
    Run script\
    """, default-environment = "notebooks" }
jlab = { cmd = """
    jupyter lab""", depends-on = [], description="""\
    Launch Jupyterlab\
    """, default-environment = "notebooks" }

[tool.pixi.feature.test.tasks]
# run unit-test tasks with Pytest for the test feature
test = { cmd = """
    coverage run -m pytest &&
    coverage report -m &&
    coverage html && coverage xml
    """, description="""\
    Run unit tests with Pytest\
    """, default-environment = "test" }

[tool.pixi.feature.nbrunner.tasks]
# programmatically run notebooks for nbrunner feature
nbs = { cmd = """
    python3 papermill_runner.py
    """, description="""\
    Run notebooks with papermill\
    """, default-environment = "nbrunner" }

[tool.pixi.feature.docs.tasks]
# preview using Quarto
quarto-preview = { cmd = """
    quarto preview . --no-browser
    """, description="""\
    Preview documentation with Quarto\
    """, default-environment = "docs" }
quarto-render = { cmd = """
    quarto render
    """, description="""\
    Render documentation with Quarto\
    """, default-environment = "docs" }
quarto-publish-gh-pages = { cmd = """
    quarto publish gh-pages
    """, description="""\
    Create Github Actions configuration for Quarto\
    """, default-environment = "docs" }
